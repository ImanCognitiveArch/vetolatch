# Role: expose a live, scoped distribution-boundary check in the README.
name: core-boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation tools
        run: python -m pip install -e ".[dev]"
      - name: Test source boundary
        run: python -m pytest tests/test_distribution_boundary.py tests/test_built_boundary_checker.py
      - name: Build distributions
        run: python -m build
      - name: Inspect wheel and sdist
        run: python scripts/check_distribution_boundary.py
